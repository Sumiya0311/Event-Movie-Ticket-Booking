services:
  mysql:
    image: mysql:8.0
    container_name: event_movie_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sumiya2003
      MYSQL_DATABASE: event_movie_booking
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: event_movie_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: event_movie_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data: